<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ХАХАХА ХАХАХА ХАХАХА</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    min-height: 100%;
    font-family: 'Arial Black', 'Impact', sans-serif;
    overflow-x: hidden;
  }

  body {
    background: linear-gradient(135deg, #1a0033, #4b0082, #ff1493, #ff8c00, #ffd700);
    background-size: 500% 500%;
    animation: gradientShift 15s ease infinite;
    padding: 40px 20px;
    position: relative;
    overflow-y: auto;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Плавающие пузыри */
  .bubble {
    position: fixed;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.05));
    animation: floatUp linear infinite;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(110vh) scale(0.4);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-20vh) scale(1.3);
      opacity: 0;
    }
  }

  /* Контейнер со всеми хахаха */
  .haha-container {
    position: relative;
    z-index: 5;
    max-width: 1400px;
    margin: 0 auto;
    text-align: center;
    line-height: 1.1;
  }

  .haha {
    display: inline-block;
    font-size: clamp(30px, 5vw, 90px);
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    margin: 5px 10px;
    letter-spacing: 0.02em;
    text-shadow:
      0 0 8px #fff,
      0 0 20px #ff00ff,
      0 0 40px #ff00ff,
      0 0 60px #ff00ff;
    animation: bounce 1.5s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
    transform-origin: center;
    transition: transform 0.3s ease;
  }

  .haha:nth-child(3n) {
    animation-delay: 0.1s;
    color: #ffff00;
    text-shadow: 0 0 8px #fff, 0 0 20px #ffff00, 0 0 40px #ff8c00;
  }

  .haha:nth-child(3n+1) {
    animation-delay: 0.3s;
    color: #00ffff;
    text-shadow: 0 0 8px #fff, 0 0 20px #00ffff, 0 0 40px #0080ff;
  }

  .haha:nth-child(3n+2) {
    animation-delay: 0.5s;
    color: #ff69b4;
    text-shadow: 0 0 8px #fff, 0 0 20px #ff1493, 0 0 40px #ff00ff;
  }

  .haha:hover {
    transform: scale(1.3) rotate(5deg);
  }

  @keyframes bounce {
    0%, 100% {
      transform: translateY(0) scale(1);
    }
    50% {
      transform: translateY(-12px) scale(1.08);
    }
  }

  /* Летящие смайлики */
  .emoji {
    position: fixed;
    pointer-events: none;
    z-index: 2;
    animation: fly linear infinite;
    opacity: 0.85;
  }

  @keyframes fly {
    0% {
      transform: translate(-15vw, 0) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translate(115vw, -20vh) rotate(720deg);
      opacity: 0;
    }
  }

  /* Взрыв смайликов при клике */
  .popup-emoji {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transition: all 1.4s cubic-bezier(0.2, 0.9, 0.4, 1);
    font-size: 32px;
  }
</style>
</head>
<body>

  <div class="haha-container" id="container"></div>

  <script>
    // ============ Генерация "Хахах" МНОГО РАЗ ============
    const container = document.getElementById('container');
    const TOTAL = 120; // сколько раз повторяем

    // Варианты для разнообразия
    const variants = ['Хахах', 'Ха-хах', 'Хахаха', 'ХАХАХ'];

    for (let i = 0; i < TOTAL; i++) {
      const span = document.createElement('span');
      span.className = 'haha';
      span.textContent = variants[i % variants.length];
      // Случайная задержка, чтобы не двигались синхронно
      span.style.animationDelay = (Math.random() * 1.5) + 's';
      // Случайный лёгкий наклон
      span.style.transform = `rotate(${(Math.random() - 0.5) * 8}deg)`;
      container.appendChild(span);
    }

    // ============ Пузыри на фоне ============
    for (let i = 0; i < 30; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = Math.random() * 120 + 30;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.animationDuration = (Math.random() * 12 + 10) + 's';
      b.style.animationDelay = (Math.random() * 12) + 's';
      document.body.appendChild(b);
    }

    // ============ Летящие смайлики ============
    const emojis = ['😂', '🤣', '😆', '😹', '😄', '😁', '🤪', '😝', '😛'];
    for (let i = 0; i < 18; i++) {
      const e = document.createElement('div');
      e.className = 'emoji';
      e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      e.style.top = Math.random() * 100 + '%';
      e.style.left = '-15vw';
      e.style.fontSize = (Math.random() * 35 + 25) + 'px';
      e.style.animationDuration = (Math.random() * 7 + 6) + 's';
      e.style.animationDelay = (Math.random() * 10) + 's';
      document.body.appendChild(e);
    }

    // ============ Взрыв смайликов при клике ============
    document.addEventListener('click', (ev) => {
      for (let i = 0; i < 12; i++) {
        const e = document.createElement('div');
        e.className = 'popup-emoji';
        e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        e.style.left = ev.clientX + 'px';
        e.style.top = ev.clientY + 'px';
        document.body.appendChild(e);
        requestAnimationFrame(() => {
          e.style.transform = `translate(${(Math.random() - 0.5) * 700}px, ${(Math.random() - 0.5) * 700}px) rotate(${Math.random() * 720}deg)`;
          e.style.opacity = '0';
        });
        setTimeout(() => e.remove(), 1500);
      }
    });
  </script>
</body>
</html>
